# ==========================================================================
# LLM 多厂商配置 —— Providers + Models 分离
#
# 职责划分：
#   providers: 连接信息（base_url / api_key / 可选默认模型）
#   models:    模型名 → provider 的绑定（+ 可选能力字段）
#
# 密钥安全：所有敏感字段用 ${ENV_VAR} 占位，运行时从环境变量解析，
# 本文件不应提交真实 api_key。
#
# 解析规则：
#   ${VAR}         → 环境变量 VAR，缺失则留空
#   ${VAR:default} → 环境变量 VAR，缺失则用 default
# ==========================================================================

providers:
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    default_model: "deepseek-flash"

  # openai:
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "${OPENAI_API_KEY}"
  #   default_model: "gpt-4o-mini"

  # ollama:
  #   base_url: "http://localhost:11434/v1"
  #   api_key: "ollama-local"   # 本地部署无鉴权，写占位即可
  #   default_model: "qwen2.5:7b"

# --------------------------------------------------------------------------
# 可用模型清单 —— 同时作为前端下拉候选项
# 字段说明：
#   name:     传给 API 的模型名
#   provider: 上方 providers 中的某个 key
#   display:  可选显示名（前端下拉用，不填则用 name）
# --------------------------------------------------------------------------
models:
  - name: "deepseek-flash"
    provider: "deepseek"

  - name: "deepseek-v4-pro"
    provider: "deepseek"

# --------------------------------------------------------------------------
# 角色 → 模型默认映射（可选，全部留空则统一使用 DEFAULT_MODEL）
# 若某个角色没在模型清单里指定，可以在这里覆盖
# --------------------------------------------------------------------------
role_defaults:
  plan: ""
  search: ""
  write: ""
  review: ""

# --------------------------------------------------------------------------
# 会话输入 model 为空时的回退值
# --------------------------------------------------------------------------
default_model: "deepseek-flash"
